spring.main.banner-mode=off
spring.main.web-application-type=none
# stdio transport uses stdout for JSON-RPC; any log output there corrupts the protocol stream.
# An empty logging.pattern.console (the older Spring AI examples' approach) is fatal on the
# Logback version bundled with Spring Boot 4 ("Empty or null pattern"), so logging is disabled
# outright instead.
logging.level.root=OFF

spring.ai.mcp.server.name=rain-commute-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.stdio=true

rain-commute.weather-api.base-url=https://api.open-meteo.com
rain-commute.geocoding-api.base-url=https://geocoding-api.open-meteo.com

rain-commute.default-commute-minutes=30

# Optional per-user overrides (saved locations, a different default commute) live outside the
# jar so they survive upgrades -- see RainCommuteProperties and AGENTS.md. "optional:" means
# startup proceeds normally when nobody has created this file.
spring.config.import=optional:file:${user.home}/.rain-commute-mcp/config.properties
